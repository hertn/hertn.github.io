<style>
/* iOS-style: grouped background, a centred contact card, inset grouped lists, and a floating
   Liquid Glass tab bar at the bottom that you can slide a finger across. Phone first. */
:root{
  color-scheme:light dark;
  --bg:#dfe6ee; --page:#90a3b1; --wash:rgba(255,255,255,.42); --card:rgba(255,255,255,.72); --text:#000000; --text-2:rgba(40,40,48,.66); --sep:rgba(60,60,67,.16);

  --shadow:0 8px 32px rgba(0,0,0,.12),0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101318; --page:#20303c; --wash:rgba(0,0,0,.5); --card:rgba(255,255,255,.12); --text:#ffffff; --text-2:rgba(235,235,245,.7); --sep:rgba(255,255,255,.14);
  --fill:rgba(120,120,128,.24); --tint:#0a84ff;
  --track:rgba(255,255,255,.14); --glass:rgba(30,30,33,.82); --glass-edge:rgba(255,255,255,.14); --lens:rgba(255,255,255,.14);
  --shadow:0 8px 32px rgba(0,0,0,.5);
}}
@media (prefers-reduced-transparency:reduce){:root{--glass:#f4f4f6;--card:#ffffff;--wash:rgba(255,255,255,.75)}@media (prefers-color-scheme:dark){:root{--glass:#2a2a2e;--card:#1c1c1e;--wash:rgba(0,0,0,.8)}}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--glass:#f4f4f6;--card:rgba(255,255,255,.9)}@media (prefers-color-scheme:dark){:root{--glass:#2a2a2e;--card:rgba(44,44,48,.92)}}}
@media (prefers-contrast:more){:root{--text-2:var(--text)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;touch-action:pan-y}
body{overflow-x:clip}
/* Safari 26 tints its top/bottom bars from the page colour, not the photo, and its fixed layer stops short of the bars: so --page is the photo's average colour and the layer overhangs. */
body::before{content:"";position:fixed;inset:-120px 0;z-index:-1;background:linear-gradient(var(--wash),var(--wash)),url("photos/wall.jpg") center/cover var(--page)}
body{margin:0;background:var(--page);color:var(--text);font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--tint);outline-offset:3px;border-radius:12px}
.wrap{max-width:540px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* contact card */
header{display:grid;grid-template-columns:auto 1fr;column-gap:14px;align-items:start;padding-top:max(20px,calc(env(safe-area-inset-top) + 12px))}
.me{width:var(--me,76px);height:var(--me,76px);border-radius:50%;object-fit:cover;display:block}
h1{font-size:1.45rem;line-height:1.15;font-weight:700;letter-spacing:-.02em;margin:0}
.role{color:var(--text-2);margin:1px 0 0;font-size:.9rem}
.intro{margin:4px 0 0;text-wrap:pretty;font-size:.9rem;line-height:1.35}
.actions{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;gap:8px;min-height:38px;padding:0 16px;border-radius:999px;font-weight:600;font-size:.88rem;background:var(--card);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);box-shadow:inset 0 0 0 .5px var(--glass-edge);transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.97);opacity:.75}
.btn svg{width:18px;height:18px}
.btn img{width:22px;height:22px}
.btn.main{background:var(--text);color:var(--bg);box-shadow:none}

/* tab panels */
main{padding-top:4px;position:relative}
[role="tabpanel"],footer.in{animation:in .28s ease}

.seg.swiping button[aria-selected="true"]:not(.over){color:var(--text)}

@keyframes in{from{opacity:0;transform:translateY(6px)}}
.group{background:var(--card);border-radius:26px;overflow:hidden;margin-bottom:14px;box-shadow:inset 0 0 0 .5px var(--glass-edge)}
.group-h{margin-top:4px;font-size:.78rem;color:var(--text-2);font-weight:600;text-transform:uppercase;letter-spacing:.02em;margin:0 20px 7px}

/* rows */
.list{list-style:none;margin:0;padding:0}
.list li{position:relative}
.list li+li::before{content:"";position:absolute;top:0;right:0;left:72px;border-top:.5px solid var(--sep)}
.item{display:flex;align-items:center;gap:12px;padding:8px 14px;min-height:62px;transition:background-color .15s}
.item:active{background:var(--fill)}
.item .pic{width:46px;height:46px;border-radius:11px;object-fit:cover;flex:none;display:grid;place-items:center;background:var(--fill);font-weight:600}
.item img.pic.icon{box-shadow:0 0 0 .5px var(--sep)}
.item .pic svg{width:26px;height:26px}
.item .t{flex:1;min-width:0}

.get{flex:none;min-width:70px;text-align:center;padding:6px 0;border-radius:999px;background:var(--fill);color:var(--tint);font-weight:700;font-size:.88rem}

/* widget header rows */
.w-h{display:flex;align-items:center;gap:12px;padding:9px 14px}
.w-h>a:not(.follow):not(.subscribe){flex:none;display:block}
.w-h>img,.w-h>a>img{display:block;width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--fill)}
.w-h .t{flex:1;min-width:0;line-height:1.25}
.w-h .name{font-weight:600;display:block}

.follow,.subscribe{flex:none;display:inline-flex;align-items:center;line-height:1;min-height:32px;padding:0 16px;border-radius:999px;color:#fff;font-weight:600;font-size:.85rem}
.follow{background:var(--ig)}
.subscribe{background:var(--yt)}
.follow:active,.subscribe:active{opacity:.7}
.chans li+li::before{left:70px}
.ig-grid{position:relative;overflow:hidden;background:var(--fill)}
.ig-grid>a{position:absolute;inset:0;z-index:1;touch-action:pan-y}
.ig-grid iframe{position:absolute;left:0;top:0;width:400px;height:430px;border:0;transform-origin:0 0}

/* video rows */
.vrow{display:flex;gap:12px;align-items:center;padding:8px 14px;transition:background-color .15s}
.vrow:active{background:var(--fill)}
.vrow .th{width:36%;max-width:150px;flex:none;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--fill)}
.vrow .th img{display:block;width:100%;height:100%;object-fit:cover}
.vrow .t{min-width:0}
.vrow .title{font-size:.9rem;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.vrow .meta{color:var(--text-2);font-size:.78rem;display:block;margin-top:3px}
.vlist li+li::before{left:16px}

/* floating Liquid Glass tab bar */
.tabbar{position:sticky;top:0;z-index:10;margin-top:12px;padding:max(8px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left))}
.tabbar::before{content:"";position:absolute;inset:0 0 -10px;z-index:-1;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;max-width:508px;margin:0 auto;padding:3px;border-radius:999px;background:var(--track);touch-action:none;user-select:none;-webkit-user-select:none}
.lens{position:absolute;top:3px;bottom:3px;left:0;border-radius:999px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18),0 0 1px rgba(0,0,0,.2);transition:transform .35s cubic-bezier(.3,1.3,.5,1),width .35s;pointer-events:none}
.seg.drag .lens{transition:transform .08s linear;scale:1.06}
.seg button{position:relative;appearance:none;border:0;background:none;color:var(--text);font-family:inherit;font-size:1rem;font-weight:600;line-height:1;min-height:38px;padding:0 4px;border-radius:999px;cursor:pointer;transition:color .2s}
.seg button[aria-selected="true"],.seg button.over{color:#000}
.seg button.fade:not(.over){color:var(--text)}
.seg.drag button[aria-selected="true"]:not(.over){color:var(--text)}

footer{color:var(--text-2);font-size:.8rem;text-align:center;padding-top:8px;padding-bottom:max(32px,env(safe-area-inset-bottom))}
footer a{color:var(--text-2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
// Everything below the intro is built from links.txt, so links can be edited on github.com.
const ICONS = {
  instagram: '<rect x="4" y="4" width="20" height="20" rx="6" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="14" cy="14" r="4.6" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="19.6" cy="8.4" r="1.4" fill="currentColor"/>',
  youtube: '<path d="M11 9.2v9.6l8-4.8z" fill="currentColor"/>',
  kofi: '<path d="M5 9h14v7a5 5 0 0 1-5 5h-4a5 5 0 0 1-5-5V9Zm14 2h1.5a2.5 2.5 0 0 1 0 5H19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>',
  camera: '<path d="M4 9.5A2.5 2.5 0 0 1 6.5 7h2.2l1.6-2.2h7.4L19.3 7h2.2A2.5 2.5 0 0 1 24 9.5v10a2.5 2.5 0 0 1-2.5 2.5h-15A2.5 2.5 0 0 1 4 19.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="14" cy="14.5" r="4" fill="none" stroke="currentColor" stroke-width="2"/>',
  photo: '<rect x="4" y="6" width="20" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="m6 20 5.5-6 4 4 2.5-2.5L22 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="18.5" cy="10.5" r="1.6" fill="currentColor"/>',
  mail: '<rect x="4" y="7" width="20" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="m5 9 9 6.5L23 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
  globe: '<circle cx="14" cy="14" r="9.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4.5 14h19M14 4.5c3 3.2 3 15.8 0 19M14 4.5c-3 3.2-3 15.8 0 19" fill="none" stroke="currentColor" stroke-width="2"/>'
};
const INSTAGRAM_USER = 'hertniks';
// Profile photo is as tall as the text beside it: top of the name to the bottom of the intro.
{
  const about = document.getElementById('about'), fit = () => {
    const name = about.querySelector('h1'), last = about.lastElementChild, r = document.createRange();
    r.selectNodeContents(name); const top = r.getClientRects()[0].top;
    r.selectNodeContents(last); const rows = r.getClientRects(), bottom = rows[rows.length - 1].bottom;
    const h = Math.round(bottom - top);
    document.documentElement.style.setProperty('--me', h + 'px');
    document.querySelector('.me').style.marginTop = Math.round(top - about.getBoundingClientRect().top) + 'px';
  };
  new ResizeObserver(fit).observe(about); document.fonts && document.fonts.ready.then(fit);
}
const safeUrl = (u) => /^(https?:|mailto:)/i.test(u || '') ? u : '';
const safePic = (u) => /^https:\/\//i.test(u || '') || (/^[\w\-./]+\.(jpe?g|png|webp|svg|gif)$/i.test(u || '') && !u.includes('..'));
const slug = (t) => t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'section';

function parse(text) {
  const sections = [];
  for (const raw of text.split('\n')) {
    const line = raw.trim();
    if (!line || (line.startsWith('#') && !line.startsWith('##'))) continue;
    if (line.startsWith('##')) {
      const [title, sub] = line.slice(2).split('|').map((x) => x.trim());
      sections.push({title, sub: sub || '', links: [], show: [], button: ''}); continue;
    }
    if (!sections.length) sections.push({title: '', sub: '', links: [], show: [], button: ''});
    const cur = sections[sections.length - 1];
    let m = line.match(/^show:\s*(\w+)/i);
    if (m) { cur.show.push(m[1].toLowerCase()); continue; }
    m = line.match(/^button:\s*(.+)$/i);
    if (m) { cur.button = m[1].trim().slice(0, 8); continue; }
    if (/^style:/i.test(line)) continue;  // older files: every section now uses the same list
    const [name, url, desc, meta, pic] = line.split('|').map((x) => x.trim());
    if (name && safeUrl(url)) cur.links.push({name, url, desc, meta, pic});
  }
  return sections.filter((s) => s.links.length || s.show.length);
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }
function img(src, alt, cls) { const i = el('img', cls); i.src = src; i.alt = alt || ''; i.loading = 'lazy'; return i; }
function link(cls, url) {
  const a = el('a', cls); a.href = safeUrl(url);
  if (!/^mailto:/i.test(url)) { a.target = '_blank'; a.rel = 'noopener'; }
  return a;
}
// Count link taps in GoatCounter. Swipes are blocked in the capture phase, so they never reach here.
document.addEventListener('click', (e) => {
  const a = e.target.closest('a[href]');
  if (a && window.goatcounter && goatcounter.count) goatcounter.count({path: a.href.replace(/^[a-z]+:(\/\/)?(www\.)?/i, ''), title: a.href, event: true});
});
function srNewTab(a) { if (a.target) a.append(el('span', 'sr', ' (opens in a new tab)')); }
function svg(key) { return '<svg viewBox="0 0 28 28" aria-hidden="true">' + ICONS[key] + '</svg>'; }
function li(child) { const l = el('li'); l.append(child); return l; }

function picture(l) {
  const key = (l.pic || '').toLowerCase();
  if (l.pic && safePic(l.pic)) return img(l.pic, '', 'pic' + (/^photos\//.test(l.pic) ? '' : ' icon'));
  const box = el('span', 'pic');
  if (ICONS[key]) box.innerHTML = svg(key); else box.textContent = l.name.charAt(0).toUpperCase();
  return box;
}

// Every section's links: a row with picture, name, one line of description, and a button or arrow.
function list(links, button) {
  const ul = el('ul', 'list');
  for (const l of links) {
    const a = link('item', l.url), t = el('span', 't');
    t.append(el('span', 'name', l.name));
    if (l.desc) t.append(el('span', 'desc', l.desc));
    srNewTab(t);
    a.append(picture(l), t);
    if (button) a.append(el('span', 'get', button));
    else a.insertAdjacentHTML('beforeend', '<svg class="go" aria-hidden="true"><use href="#out"/></svg>');
    ul.append(li(a));
  }
  const g = el('div', 'group'); g.append(ul); return g;
}

// Instagram's embed has a white header we can't restyle, so we draw our own header and
// show only the embed's 3 x 2 photo grid. At 400px wide the grid starts 146px down and is 268px tall.
const IG = {w: 400, top: 148, h: 264};  // trimmed 2px top and bottom: the embed draws white lines at the grid edges
function instagram() {
  const card = el('div', 'group'), head = el('div', 'w-h');
  const url = 'https://www.instagram.com/' + INSTAGRAM_USER + '/';
  const t = el('div', 't'), name = link('name', url); name.textContent = INSTAGRAM_USER; t.append(name);
  t.append(el('span', 'meta', 'Instagram'));
  const follow = link('follow', url); follow.textContent = 'Follow';
  follow.setAttribute('aria-label', 'Follow @' + INSTAGRAM_USER + ' on Instagram (opens in a new tab)');
  head.append(img('me.jpg', ''), t, follow);
  const grid = el('div', 'ig-grid'), f = el('iframe');
  f.title = 'Latest Instagram posts by @' + INSTAGRAM_USER; f.setAttribute('scrolling', 'no'); f.tabIndex = -1;
  // The embed would swallow every touch (no swiping between tabs), so a clear layer sits on top; tapping it opens the profile.
  const cover = link('', url); cover.setAttribute('aria-label', 'Latest posts on Instagram (opens in a new tab)');
  grid.append(f, cover); card.append(head, grid);
  new ResizeObserver(() => {
    const k = grid.clientWidth / IG.w;
    grid.style.height = Math.round(IG.h * k) + 'px';
    f.style.transform = 'scale(' + k + ') translateY(-' + IG.top + 'px)';
  }).observe(grid);
  // The embed scrolls the page to itself when it loads. Load it only when it is near the
  // screen, and put the page back unless the visitor scrolled on their own.
  let touched = false;
  for (const ev of ['wheel', 'touchstart', 'keydown', 'mousedown']) addEventListener(ev, () => { touched = true; }, {passive: true});
  const start = new IntersectionObserver(([e]) => {
    if (!e.isIntersecting) return;
    start.disconnect(); touched = false;
    const y = scrollY;
    const keep = () => { if (!touched && Math.abs(scrollY - y) > 2) scrollTo({top: y, behavior: 'instant'}); };
    addEventListener('scroll', keep);
    setTimeout(() => removeEventListener('scroll', keep), 4000);
    f.src = url + 'embed/';
  }, {rootMargin: '400px 0px'});
  start.observe(grid);
  return card;
}

function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  for (const [n, w] of [[31536000, 'year'], [2592000, 'month'], [604800, 'week'], [86400, 'day'], [3600, 'hour']]) {
    if (s >= n) { const k = Math.floor(s / n); return k + ' ' + w + (k > 1 ? 's' : '') + ' ago'; }
  }
  return 'just now';
}
const short = (n) => n >= 1e6 ? (n / 1e6).toFixed(1).replace('.0', '') + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1).replace('.0', '') + 'K' : String(n);

function youtube() {
  const box = el('div'); box.hidden = true;
  fetch('latest.json', {cache: 'no-cache'}).then((r) => r.json()).then((d) => {
    const chans = el('ul', 'list chans'), vids = [];
    for (const c of d.youtube || []) {
      const head = el('div', 'w-h');
      const pic = link('', c.url); pic.append(img(c.avatar || '', '')); pic.tabIndex = -1; pic.setAttribute('aria-hidden', 'true');
      const t = el('div', 't'), name = link('name', c.url); name.textContent = c.name; t.append(name);
      t.append(el('span', 'meta', c.subscribers ? c.subscribers + ' subscribers' : c.handle || ''));
      const sub = link('subscribe', c.url + '?sub_confirmation=1'); sub.textContent = 'Subscribe';
      sub.setAttribute('aria-label', 'Subscribe to ' + c.name + ' on YouTube (opens in a new tab)');
      head.append(pic, t, sub); chans.append(li(head));
      for (const v of c.videos) vids.push({...v, channel: c.name});
    }
    vids.sort((x, y) => (y.published || '').localeCompare(x.published || ''));
    vids.length = Math.min(vids.length, 4);  // the 4 newest, from whichever channel
    const ul = el('ul', 'list vlist');
    for (const v of vids) {
      const a = link('vrow', v.url), th = el('span', 'th'), t = el('span', 't');
      th.append(img('https://i.ytimg.com/vi/' + encodeURIComponent(v.id) + '/mqdefault.jpg'));
      t.append(el('span', 'title', v.title), el('span', 'meta', v.channel + ' · ' + ago(v.published)));
      srNewTab(t); a.append(th, t); ul.append(li(a));
    }
    const g1 = el('div', 'group'), g2 = el('div', 'group'); g1.append(chans); g2.append(ul);
    box.append(g1, el('p', 'group-h', 'Latest videos'), g2); box.hidden = false;
  }).catch(() => {});  // no videos yet: stays hidden
  return box;
}

function renderButtons(links) {
  const box = document.getElementById('buttons'); box.textContent = '';
  links.forEach((l, i) => {
    const a = link('btn' + (i === links.length - 1 ? ' main' : ''), l.url), key = (l.pic || '').toLowerCase();
    if (key === 'kofi') a.append(img('kofi.png'));
    else if (ICONS[key]) a.insertAdjacentHTML('beforeend', svg(key));
    a.append(el('span', '', l.name)); srNewTab(a); box.append(a);
  });
}

function render(sections) {
  const root = document.getElementById('links'), tabs = document.getElementById('tabs'), lens = tabs.querySelector('.lens');
  root.textContent = '';
  const panels = [];
  for (const s of sections) {
    if (s.title.toLowerCase() === 'top buttons') { renderButtons(s.links); continue; }
    const id = slug(s.title), panel = el('section');
    panel.id = id; panel.setAttribute('role', 'tabpanel');
    const tab = el('button'); tab.id = 'tab-' + id; tab.type = 'button';
    tab.textContent = s.title;
    tab.setAttribute('role', 'tab'); tab.setAttribute('aria-controls', id); panel.setAttribute('aria-labelledby', tab.id);
    if (s.show.includes('instagram')) panel.append(instagram());
    if (s.show.includes('youtube')) panel.append(youtube());
    if (s.links.length) panel.append(list(s.links, s.button));
    tabs.append(tab); root.append(panel); panels.push({id, tab, panel});
  }
  let current = null;
  const placeLens = (tab) => { lens.style.width = tab.offsetWidth + 'px'; lens.style.transform = 'translateX(' + tab.offsetLeft + 'px)'; };
  const show = (id, opts = {}) => {
    const pick = panels.find((p) => p.id === id) || panels[0];
    for (const p of panels) {
      const on = p === pick;
      p.tab.setAttribute('aria-selected', on); p.tab.tabIndex = on ? 0 : -1; p.panel.hidden = !on;
      if (!on) p.panel.style.animation = '';  // a swiped-in panel skips its fade; restore it for the next tap
    }
    placeLens(pick.tab);
    if (opts.focus) pick.tab.focus();
    if (opts.save) history.replaceState(null, '', '#' + pick.id);
    if (current && current !== pick && tabs.parentNode.getBoundingClientRect().top <= 1) scrollTo(0, root.offsetTop - tabs.parentNode.offsetHeight);  // switching while scrolled: show the new tab from its top
    if (current && current !== pick) { const f = document.querySelector('footer'); f.classList.remove('in'); void f.offsetWidth; f.classList.add('in'); }  // fade the footer in with the new panel instead of it jumping first
    current = pick;
  };
  panels.forEach((p, i) => {
    p.tab.onclick = (e) => { if (e.detail === 0) show(p.id, {save: true}); };  // Enter / Space from the keyboard
    p.tab.onkeydown = (e) => {  // arrow keys move between tabs, like a native tab bar
      const d = {ArrowRight: 1, ArrowLeft: -1}[e.key]; if (!d) return;
      show(panels[(i + d + panels.length) % panels.length].id, {focus: true, save: true});
    };
  });
  // Slide a finger (or mouse) along the bar: the glass lens follows, and the tab under it is
  // picked when you let go. A plain tap works the same way.
  const tabAt = (x) => panels.reduce((best, p) => {
    const r = p.tab.getBoundingClientRect(), d = Math.abs(x - (r.left + r.width / 2));
    return d < best.d ? {p, d} : best;
  }, {p: panels[0], d: Infinity}).p;
  let drag = null;
  tabs.addEventListener('pointerdown', (e) => {
    drag = {id: e.pointerId, x: e.clientX, moved: false}; tabs.setPointerCapture(e.pointerId);
  });
  const moveLens = (x) => {
    const bar = tabs.getBoundingClientRect(), w = current.tab.offsetWidth;
    const left = Math.max(5, Math.min(bar.width - w - 5, x - bar.left - w / 2));
    lens.style.transform = 'translateX(' + left + 'px)';
    const over = tabAt(x); panels.forEach((p) => p.tab.classList.toggle('over', p === over));
  };
  tabs.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    if (!drag.moved) {  // a tap only springs the pill to the tab; following the finger starts after a real slide
      if (Math.abs(e.clientX - drag.x) < 8) return;
      drag.moved = true; tabs.classList.add('drag');
    }
    moveLens(e.clientX);
  });
  const end = (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    drag = null; tabs.classList.remove('drag'); panels.forEach((p) => p.tab.classList.remove('over'));
    show(tabAt(e.clientX).id, {save: true});
  };
  tabs.addEventListener('pointerup', end);
  tabs.addEventListener('pointercancel', (e) => { if (drag) { drag = null; tabs.classList.remove('drag'); panels.forEach((p) => p.tab.classList.remove('over')); placeLens(current.tab); } });
  addEventListener('resize', () => current && placeLens(current.tab));
  // iOS-style paging: drag sideways anywhere on the page and the content follows the finger, with the
  // next tab peeking in beside it. Let go past a third of the width (or flick) to switch, else it springs back.
  // touch-action: pan-y keeps vertical scrolling native; the browser cancels the drag once a scroll starts.
  const GAP = 32;
  let pg = null;
  const resetPager = () => {
    root.style.transition = ''; root.style.transform = '';
    for (const p of panels) if (p !== current) { p.panel.hidden = true; p.panel.style.cssText = ''; }
    current.panel.style.animation = '';
  };
  const neighbour = (d) => panels[panels.indexOf(current) + d];
  // Tabs are equal width, so the pill only moves (no width change, no layout). Positions are measured once per swipe.
  const lensBetween = (a, b, t) => {
    lens.style.transform = 'translateX(' + (pg.left[a.id] + (pg.left[b.id] - pg.left[a.id]) * t) + 'px)';
    const near = t < .5 ? a : b;
    if (pg.near !== near) { pg.near = near; a.classList.toggle('over', near === a); b.classList.toggle('over', near === b); }  // dark text on whichever tab the pill covers
  };
  document.addEventListener('pointerdown', (e) => {
    if (e.pointerType !== 'touch' || !e.isPrimary || tabs.contains(e.target) || e.clientX < 24 || e.clientX > innerWidth - 24) return;
    pg = {x: e.clientX, y: e.clientY, dx: 0, on: false, track: [[e.timeStamp, e.clientX]]};
  });
  document.addEventListener('pointermove', (e) => {
    if (!pg || !e.isPrimary) return;
    const dx = e.clientX - pg.x, dy = e.clientY - pg.y;
    if (!pg.on) {
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      if (Math.abs(dx) < Math.abs(dy) * 1.2) { pg = null; return; }  // a vertical scroll, leave it alone
      pg.on = true; pg.w = root.clientWidth; pg.left = {};
      for (const p of panels) pg.left[p.tab.id] = p.tab.offsetLeft;
      lens.style.transition = 'none'; tabs.classList.add('swiping'); root.classList.add('paging');
      const bar = tabs.parentNode.getBoundingClientRect().bottom, top = Math.max(0, bar - root.getBoundingClientRect().top);
      current.panel.style.animation = 'none';
      for (const [d, p] of [[-1, neighbour(-1)], [1, neighbour(1)]]) if (p) {
        p.panel.hidden = false;
        p.panel.style.cssText = 'position:absolute;animation:none;top:' + top + 'px;width:' + current.panel.offsetWidth + 'px;left:' + (current.panel.offsetLeft + d * (pg.w + GAP)) + 'px';
      }
    }
    pg.dx = (dx > 0 ? !neighbour(-1) : !neighbour(1)) ? dx / 3 : dx;  // rubber band past the first and last tab
    pg.track.push([e.timeStamp, e.clientX]); if (pg.track.length > 6) pg.track.shift();
    if (!pg.frame) pg.frame = requestAnimationFrame(() => {  // at most one paint per screen refresh
      if (!pg) return;
      pg.frame = 0;
      root.style.transform = 'translate3d(' + pg.dx + 'px,0,0)';
      const to = neighbour(pg.dx < 0 ? 1 : -1);
      if (to) lensBetween(current.tab, to.tab, Math.min(1, Math.abs(pg.dx) / pg.w));
    });
  });
  const release = (e, cancelled) => {
    if (!pg) return;
    const g = pg; pg = null;
    if (!g.on) return;
    cancelAnimationFrame(g.frame);
    const [t0, x0] = g.track[0], v = (e.clientX - x0) / Math.max(1, e.timeStamp - t0);  // px per ms
    const d = g.dx < 0 ? 1 : -1, to = neighbour(d);
    const go = !cancelled && to && (Math.abs(g.dx) > g.w / 3 || (Math.abs(v) > 0.35 && Math.sign(v) === -d));
    // Content and pill finish together with the same curve and duration.
    const ease = 'transform .3s cubic-bezier(.2,.8,.2,1)';
    tabs.classList.remove('swiping'); panels.forEach((p) => p.tab.classList.remove('over'));
    if (go) { to.tab.classList.add('over'); current.tab.classList.add('fade'); }
    lens.style.transition = ease; lens.style.transform = 'translateX(' + g.left[(go ? to : current).tab.id] + 'px)';
    root.style.transition = ease;
    root.style.transform = go ? 'translate3d(' + (-d * (g.w + GAP)) + 'px,0,0)' : '';
    // A swipe that ended on a link must not open it.
    const block = (c) => { c.preventDefault(); c.stopPropagation(); };
    addEventListener('click', block, {capture: true, once: true});
    setTimeout(() => removeEventListener('click', block, true), 350);
    const done = (t) => {
      if (t.target !== root) return;  // ignore transitions of things inside the page
      root.removeEventListener('transitionend', done);
      resetPager(); root.classList.remove('paging'); lens.style.transition = '';
      panels.forEach((p) => p.tab.classList.remove('over', 'fade'));
      if (go) { to.panel.style.cssText = 'animation:none'; show(to.id, {save: true}); }
    };
    root.addEventListener('transitionend', done);
  };
  document.addEventListener('pointerup', (e) => release(e, false));
  document.addEventListener('pointercancel', (e) => release(e, true));
  show(location.hash.slice(1));
  addEventListener('hashchange', () => show(location.hash.slice(1)));
}

fetch('links.txt', {cache: 'no-cache'}).then((r) => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then((t) => render(parse(t)))
  .catch(() => { document.getElementById('links').innerHTML = '<p class="wrap">The links could not be loaded right now. Find my projects on <a href="https://github.com/hertn" target="_blank" rel="noopener">GitHub</a>.</p>'; });
</script>
